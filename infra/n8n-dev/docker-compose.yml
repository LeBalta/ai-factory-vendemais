services:

  n8n:
    image: n8nio/n8n:2.39.8
    container_name: vendemais-n8n-dev
    restart: unless-stopped

    ports:
      - "5679:5678"

    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false

      - GENERIC_TIMEZONE=America/Campo_Grande
      - TZ=America/Campo_Grande

      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false

      # --------------------------------------
      # RETENCAO / EXCLUSAO REAL
      # --------------------------------------

      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=5000

      # --------------------------------------
      # PROMETHEUS
      # --------------------------------------

      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_DEFAULT_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true

      # --------------------------------------
      # OPENTELEMETRY
      # --------------------------------------

      - N8N_OTEL_ENABLED=true
      - N8N_OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - N8N_OTEL_EXPORTER_SERVICE_NAME=vendemais-n8n
      - N8N_OTEL_TRACES_SAMPLE_RATE=1.0
      - N8N_OTEL_TRACES_INCLUDE_NODE_SPANS=true
      - N8N_OTEL_TRACES_PRODUCTION_ONLY=false

    volumes:
      - vendemais_n8n_dev_data:/home/node/.n8n

    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: vendemais-jaeger
    restart: unless-stopped

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    container_name: vendemais-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - vendemais_prometheus_data:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - n8n

  grafana:
    image: grafana/grafana:latest
    container_name: vendemais-grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD nao definida}
      - GF_USERS_ALLOW_SIGN_UP=false

    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - vendemais_grafana_data:/var/lib/grafana

    ports:
      - "3001:3000"

    depends_on:
      - prometheus
      - jaeger

volumes:

  vendemais_n8n_dev_data:
    external: false

  vendemais_prometheus_data:

  vendemais_grafana_data:


