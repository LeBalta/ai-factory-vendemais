global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: vendemais-n8n
    metrics_path: /metrics
    static_configs:
      - targets:
          - n8n:5678

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
